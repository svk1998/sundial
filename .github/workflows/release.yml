name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, for the "What's new" commit list

      # rust-toolchain.toml pins stable + the MSVC target; rustup picks it up on first cargo call.
      - name: Show toolchain
        run: rustup show

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dist = "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/sundial.exe "$dist/sundial-$tag-x86_64-windows.exe"
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/sundial.exe, README.md `
            -DestinationPath "$dist/sundial-$tag-x86_64-windows.zip"
          # Materialise the list first so the sums file isn't picked up while it's being written.
          $sums = @(Get-ChildItem $dist -File) | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $sums | Out-File -Encoding ascii "$dist/SHA256SUMS.txt"

      # Pinned so a new Inno Setup major can't change the build under us; portable mode
      # extracts it without registering an install.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $setup
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", `
            "/CURRENTUSER", "/PORTABLE=1", "/NOICONS", "/DIR=$env:RUNNER_TEMP\inno" -PassThru
          $p.WaitForExit()
          if (-not (Test-Path "$env:RUNNER_TEMP\inno\ISCC.exe")) { throw "Inno Setup install failed" }

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "$env:RUNNER_TEMP\inno\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DSourceExe=..\target\x86_64-pc-windows-msvc\release\sundial.exe" `
            installer\sundial.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-Item "dist/sundial-v$version-setup.exe"
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -Append -Encoding ascii "dist/SHA256SUMS.txt"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($prev) { "$prev..$tag" } else { $tag }
          $changes = git log $range --no-merges --format="- %s" |
            Where-Object { $_ -notmatch "^- chore: bump version" }
          if (-not $changes) { $changes = "- Maintenance release." }
          $notes = (Get-Content .github/release-notes.md -Raw).Replace("{{TAG}}", $tag)
          $notes.Replace("{{CHANGES}}", ($changes -join "`n")) | Out-File -Encoding utf8 "$env:RUNNER_TEMP/notes.md"
          # --generate-notes appends GitHub's "Full Changelog" link after our notes.
          gh release create $tag dist/* `
            --title $tag `
            --notes-file "$env:RUNNER_TEMP/notes.md" `
            --generate-notes `
            --verify-tag
