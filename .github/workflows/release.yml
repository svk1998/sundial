name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins stable + the MSVC target; rustup picks it up on first cargo call.
      - name: Show toolchain
        run: rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dist = "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/sundial.exe "$dist/sundial-$tag-x86_64-windows.exe"
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/sundial.exe, README.md `
            -DestinationPath "$dist/sundial-$tag-x86_64-windows.zip"
          Get-ChildItem $dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -Encoding ascii "$dist/SHA256SUMS.txt"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* `
            --title "${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
